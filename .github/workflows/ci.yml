name: CI

# Todo PR passa por typecheck e testes. A master, além disso, vai para
# produção em https://nauri.app — só depois que as checagens passam.
on:
  pull_request:
  push:
    branches: [master]

# Um PR atualizado cancela a execução antiga dele. Na master nunca cancela:
# um deploy interrompido no meio é pior que um deploy a mais.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Typecheck e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    name: Deploy em nauri.app
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # O environment guarda o token da Cloudflare e mostra o link do deploy no
    # GitHub. Também permite exigir aprovação manual, se um dia for preciso.
    environment:
      name: production
      url: https://nauri.app
    # Deploys da master em fila, um por vez, na ordem dos pushes.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # build:web embute a URL de produção, limpa o cache do Metro e falha se
      # localhost:8787 aparecer no bundle. Os segredos do Worker já estão na
      # Cloudflare e o deploy não os altera.
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Health check
        run: |
          for i in $(seq 1 10); do
            if curl -fsS https://nauri.app/health | grep -q '"ok":true'; then
              echo "nauri.app respondendo"; exit 0
            fi
            sleep 5
          done
          echo "::error::https://nauri.app/health não respondeu {\"ok\":true} depois do deploy"
          exit 1
